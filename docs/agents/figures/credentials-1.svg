<!-- 凭证与身份三家对读 · 图 1。由 credentials.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 900 240" role="img" aria-label="codex 的 agent 身份链：本地生成 ed25519 密钥、注册 agent 换取 runtime id、注册 task 换取 task id、每个请求签一次 AgentAssertion，私钥始终不离开本机">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"></polygon>
    </marker>
  </defs>
  <text x="0" y="18" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.6">本机</text>
  <line x1="0" y1="26" x2="900" y2="26" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"></line>
  <rect x="0" y="46" width="190" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="95" y="70" text-anchor="middle" font-size="13" fill="currentColor">① 本地生成 ed25519</text>
  <text x="95" y="88" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">私钥留在本机</text>
  <rect x="238" y="46" width="190" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="333" y="70" text-anchor="middle" font-size="13" fill="currentColor">② 注册 agent</text>
  <text x="333" y="88" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">得 agent_runtime_id</text>
  <rect x="476" y="46" width="190" height="52" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="571" y="70" text-anchor="middle" font-size="13" fill="currentColor">③ 注册 task</text>
  <text x="571" y="88" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">得 task_id（可加密下发）</text>
  <rect class="hl" x="714" y="46" width="186" height="52" rx="4" fill="none" stroke-width="2"></rect>
  <text x="807" y="70" text-anchor="middle" font-size="13" fill="currentColor">④ 每个请求签一次</text>
  <text x="807" y="88" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">AgentAssertion 头</text>
  <line x1="190" y1="72" x2="232" y2="72" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"></line>
  <line x1="428" y1="72" x2="470" y2="72" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"></line>
  <line x1="666" y1="72" x2="708" y2="72" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"></line>
  <text x="333" y="128" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">上传公钥 + ABOM</text>
  <text x="333" y="144" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">版本 / harness / 运行位置</text>
  <text x="571" y="128" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">签 runtime_id : timestamp</text>
  <text x="807" y="128" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">签 runtime_id : task_id : timestamp</text>
  <line x1="0" y1="168" x2="900" y2="168" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"></line>
  <text x="0" y="190" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.6">服务端拿到的</text>
  <text x="0" y="214" font-size="12.5" fill="currentColor">一次 run 一个可独立验证的身份：谁签的（runtime id）· 哪一次任务（task id）· 什么 harness 的什么版本（ABOM）</text>
</svg>
