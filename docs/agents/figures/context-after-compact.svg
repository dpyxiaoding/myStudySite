<!-- 上下文管理：三家差异 · 同一段对话压缩之后三家各留下什么（示意，不按比例）。由 context.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 720 292" role="img" aria-label="同一段对话压缩之后三家各留下什么。压缩前是背景加上用户消息、模型回复、工具调用交替的十二条。Claude Code 留下系统提示词、重读的项目说明、摘要、最近的一组用户消息和回复原样，再装回文件和技能等。codex 只留三条用户消息，背景按新窗口重新渲染，插在最后一条用户消息之前，压缩结果放在最后。dsh 留下系统提示词、摘要和末尾四条原样，背景快照被遮掉时才重新追加">
