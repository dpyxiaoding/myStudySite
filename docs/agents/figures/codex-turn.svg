<!-- codex 的回合循环与中断 · 一轮怎么跑。由 codex/turn-loop.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 720 320" role="img" aria-label="codex 的一轮：开始一轮，请求模型；还要继续（有工具调用或有新插话）就等工具跑完、把结果记进历史，再请求一次；不用继续就运行 Stop 钩子，放行则这一轮结束。Esc 可以打断模型输出，也可以打断工具执行">
  <defs>
    <marker id="cxt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="currentColor"></polygon>
    </marker>
  </defs>
  <rect class="pane" x="10" y="20" width="160" height="104" rx="2"></rect>
  <text x="90" y="46" text-anchor="middle" font-size="13.5">① 开始一轮</text>
  <text x="90" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">你发的消息</text>
  <text x="90" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">或子代理来信、目标续跑</text>
  <text x="90" y="102" text-anchor="middle" font-size="10.5" opacity="0.72">UserPromptSubmit 钩子</text>
  <rect class="pane" x="190" y="20" width="160" height="104" rx="2"></rect>
  <text x="270" y="46" text-anchor="middle" font-size="13.5">② 请求模型</text>
  <text x="270" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">带上全部历史，流式接收</text>
  <text x="270" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">工具调用一完整就开跑</text>
  <text class="warn" x="270" y="106" text-anchor="middle" font-size="10.5">Esc → 中断这一轮</text>
  <rect class="pane" x="370" y="20" width="160" height="104" rx="2"></rect>
  <text x="450" y="46" text-anchor="middle" font-size="13.5">③ 还要继续吗</text>
  <text x="450" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">回复里有工具调用</text>
  <text x="450" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">或者又来了新插话</text>
  <rect class="pane" x="550" y="20" width="160" height="104" rx="2"></rect>
  <text x="630" y="46" text-anchor="middle" font-size="13.5">⑥ Stop 钩子</text>
  <text x="630" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">拦下：理由当新提示</text>
  <text x="630" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">回到 ② 接着跑</text>
  <text x="630" y="102" text-anchor="middle" font-size="10.5" opacity="0.72">没有次数上限</text>
  <rect class="pane pane-us" x="370" y="208" width="160" height="104" rx="2"></rect>
  <text class="hl" x="450" y="234" text-anchor="middle" font-size="13.5">④ 等工具跑完</text>
  <text x="450" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">能并发的一起跑</text>
  <text x="450" y="274" text-anchor="middle" font-size="10.5" opacity="0.72">不能并发的独占执行</text>
  <text class="warn" x="450" y="298" text-anchor="middle" font-size="10.5">Esc → 中断这一轮</text>
  <rect class="pane pane-us" x="190" y="208" width="160" height="104" rx="2"></rect>
  <text class="hl" x="270" y="234" text-anchor="middle" font-size="13.5">⑤ 结果记进历史</text>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">按调用的顺序记</text>
  <text class="hl" x="270" y="274" text-anchor="middle" font-size="10.5">插话在这之后并入</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" opacity="0.72">每个调用都要有结果</text>
  <rect class="pane" x="550" y="208" width="160" height="104" rx="2"></rect>
  <text x="630" y="234" text-anchor="middle" font-size="13.5">⑦ 这一轮结束</text>
  <text x="630" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">交回给你</text>
  <text x="630" y="274" text-anchor="middle" font-size="10.5" opacity="0.72">状态：完成、中断或失败</text>
  <text x="630" y="290" text-anchor="middle" font-size="10.5" opacity="0.72">Tab 排队的消息开启下一轮</text>
  <line x1="172" y1="72" x2="186" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <line x1="352" y1="72" x2="366" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <line x1="532" y1="72" x2="546" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <text x="540" y="13" text-anchor="middle" font-size="10.5">不用继续</text>
  <line x1="450" y1="126" x2="450" y2="204" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <text x="458" y="170" font-size="10.5">要继续</text>
  <line x1="368" y1="260" x2="354" y2="260" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <line x1="270" y1="206" x2="270" y2="128" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <text x="278" y="170" font-size="10.5">再请求一次</text>
  <line x1="630" y1="126" x2="630" y2="204" stroke="currentColor" stroke-width="1.3" marker-end="url(#cxt-ar)"></line>
  <text x="638" y="170" font-size="10.5">放行</text>
</svg>
