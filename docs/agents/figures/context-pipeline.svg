<!-- 上下文管理三家对读 · 一段上下文从生到死。由 context.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 720 200" role="img" aria-label="一段上下文从生到死的五步：装配决定塞什么，计量算用了多少，裁剪在进历史前当场砍一刀，压缩把前面换成摘要，隔离让它压根不进这个窗口">
