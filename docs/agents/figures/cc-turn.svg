<!-- Claude Code 的回合循环与中断 · 一轮怎么跑。由 claude-code/turn-loop.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 720 320" role="img" aria-label="Claude Code 的一轮：开始一轮，Claude 回复；回复里有工具调用就执行工具、收尾这一批（PostToolBatch 钩子、并入排队的消息），Claude 接着回复；没有工具调用就运行 Stop 钩子，放行则这一轮结束。Esc 可以打断模型输出，也可以打断工具执行">
  <defs>
    <marker id="cct-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="currentColor"></polygon>
    </marker>
  </defs>
  <rect class="pane" x="10" y="20" width="160" height="104" rx="2"></rect>
  <text x="90" y="46" text-anchor="middle" font-size="13.5">① 开始一轮</text>
  <text x="90" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">你发的消息</text>
  <text x="90" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">或后台任务、定时任务的注入</text>
  <text x="90" y="102" text-anchor="middle" font-size="10.5" opacity="0.72">UserPromptSubmit 钩子</text>
  <rect class="pane" x="190" y="20" width="160" height="104" rx="2"></rect>
  <text x="270" y="46" text-anchor="middle" font-size="13.5">② Claude 回复</text>
  <text x="270" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">带上全部历史，流式接收</text>
  <text x="270" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">出错按回复进度决定重不重发</text>
  <text class="warn" x="270" y="106" text-anchor="middle" font-size="10.5">Esc → aborted_streaming</text>
  <rect class="pane" x="370" y="20" width="160" height="104" rx="2"></rect>
  <text x="450" y="46" text-anchor="middle" font-size="13.5">③ 有工具调用吗</text>
  <text x="450" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">回复可以是文字、工具调用</text>
  <text x="450" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">或者两者都有</text>
  <rect class="pane" x="550" y="20" width="160" height="104" rx="2"></rect>
  <text x="630" y="46" text-anchor="middle" font-size="13.5">⑥ Stop 钩子</text>
  <text x="630" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">拦下：带着理由回到 ②</text>
  <text x="630" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">连续最多拦 8 次</text>
  <text x="630" y="102" text-anchor="middle" font-size="10.5" opacity="0.72">/goal 也走这一步</text>
  <rect class="pane pane-us" x="370" y="208" width="160" height="104" rx="2"></rect>
  <text class="hl" x="450" y="234" text-anchor="middle" font-size="13.5">④ 执行工具</text>
  <text x="450" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">先过 PreToolUse 和权限</text>
  <text x="450" y="274" text-anchor="middle" font-size="10.5" opacity="0.72">只读的并发，最多 10 个</text>
  <text x="450" y="290" text-anchor="middle" font-size="10.5" opacity="0.72">会改状态的逐个执行</text>
  <text class="warn" x="450" y="306" text-anchor="middle" font-size="10.5">Esc → aborted_tools</text>
  <rect class="pane pane-us" x="190" y="208" width="160" height="104" rx="2"></rect>
  <text class="hl" x="270" y="234" text-anchor="middle" font-size="13.5">⑤ 这一批收尾</text>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">PostToolBatch 钩子</text>
  <text class="hl" x="270" y="274" text-anchor="middle" font-size="10.5">排队的消息在这里并入</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" opacity="0.72">结果作为下一条消息发回</text>
  <rect class="pane" x="550" y="208" width="160" height="104" rx="2"></rect>
  <text x="630" y="234" text-anchor="middle" font-size="13.5">⑦ 这一轮结束</text>
  <text x="630" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">交回给你</text>
  <text x="630" y="274" text-anchor="middle" font-size="10.5" opacity="0.72">还在排队的消息开启下一轮</text>
  <text x="630" y="290" text-anchor="middle" font-size="10.5" opacity="0.72">SDK 发出结果消息</text>
  <line x1="172" y1="72" x2="186" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <line x1="352" y1="72" x2="366" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <line x1="532" y1="72" x2="546" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <text x="540" y="13" text-anchor="middle" font-size="10.5">没有工具调用</text>
  <line x1="450" y1="126" x2="450" y2="204" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <text x="458" y="170" font-size="10.5">有工具调用</text>
  <line x1="368" y1="260" x2="354" y2="260" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <line x1="270" y1="206" x2="270" y2="128" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <text x="278" y="170" font-size="10.5">接着回复</text>
  <line x1="630" y1="126" x2="630" y2="204" stroke="currentColor" stroke-width="1.3" marker-end="url(#cct-ar)"></line>
  <text x="638" y="170" font-size="10.5">放行</text>
</svg>
