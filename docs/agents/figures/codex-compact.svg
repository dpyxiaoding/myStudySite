<svg viewBox="0 0 720 352" role="img" aria-label="codex 一次压缩的八步：触发、PreCompact 钩子、按服务商选实现、发压缩请求；然后保留用户消息、按新窗口装回初始背景、运行 SessionStart 钩子、运行 PostCompact 钩子">
  <defs>
    <marker id="cx-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
