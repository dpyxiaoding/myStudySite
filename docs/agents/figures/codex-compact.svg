  <text x="630" y="258" text-anchor="middle" font-size="10.5" opacity="0.72">服务端：最近 6.4 万 token</text>
  <text x="630" y="274" text-anchor="middle" font-size="10.5" opacity="0.72">本地：最近 2 万 token</text>
  <text x="630" y="290" text-anchor="middle" font-size="10.5" opacity="0.72">末尾接上压缩结果</text>
  <rect class="pane" x="370" y="208" width="160" height="104" rx="2"></rect>
  <text x="450" y="236" text-anchor="middle" font-size="13.5">⑥ 装回初始背景</text>
  <text x="450" y="260" text-anchor="middle" font-size="10.5" opacity="0.72">世界状态按新窗口全量渲染</text>
  <text x="450" y="276" text-anchor="middle" font-size="10.5" opacity="0.72">插在最后一条用户消息前</text>
  <rect class="pane" x="190" y="208" width="160" height="104" rx="2"></rect>
