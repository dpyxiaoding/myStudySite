  <text x="450" y="70" text-anchor="middle" font-size="10.5" opacity="0.72">OpenAI 等：服务端压缩</text>
  <text x="450" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">其他服务商：本地摘要</text>
  <text x="450" y="102" text-anchor="middle" font-size="10.5" opacity="0.72">实验开关：直接换新窗口</text>
  <rect class="pane" x="550" y="20" width="160" height="104" rx="2"></rect>
