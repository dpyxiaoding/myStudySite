  <text x="90" y="86" text-anchor="middle" font-size="10.5" opacity="0.72">换模型时先用旧模型压</text>
  <text x="90" y="102" text-anchor="middle" font-size="10.5" opacity="0.72">手动：/compact</text>
  <rect class="pane" x="190" y="20" width="160" height="104" rx="2"></rect>
