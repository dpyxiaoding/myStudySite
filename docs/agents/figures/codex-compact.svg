  <text x="630" y="72" text-anchor="middle" font-size="10.5" opacity="0.72">服务端：原请求加触发项</text>
  <text x="630" y="88" text-anchor="middle" font-size="10.5" opacity="0.72">本地：历史加摘要提示词</text>
