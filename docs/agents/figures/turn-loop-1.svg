<!-- 回合循环与中断三家对读 · 图 1。由 turn-loop.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 760 250" role="img" aria-label="一个回合内部的流水线与三个外部打断点：用户插话只在轮顶的注入点进入，Esc 中断作用在模型请求与工具执行两处，预算与轮次上界拦在轮顶三道闸">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="hl-fill" d="M 0 0 L 10 5 L 0 10 z"></path>
    </marker>
  </defs>
  <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="currentColor">
    <!-- 上方：插话 -->
    <text class="hl-fill" x="150" y="16" font-size="10.5">用户补一句话</text>
    <line class="hl" x1="196" y1="24" x2="196" y2="60" stroke-width="1.3" marker-end="url(#a2)"></line>
    <text class="hl-fill" x="206" y="42" font-size="9.5" opacity=".9">只在这一个点</text>
    <!-- 主流水线 -->
    <rect x="16" y="66" width="94" height="40" fill="none" stroke="currentColor" stroke-width="1.5" rx="3"></rect>
    <text x="27" y="84" font-size="10">轮顶三道闸</text>
    <text x="27" y="98" font-size="9" opacity=".65">取消/步数/预算</text>
    <rect x="150" y="66" width="94" height="40" fill="none" stroke="currentColor" stroke-width="1.5" rx="3"></rect>
    <text x="176" y="90" font-size="10">注入点</text>
    <rect x="284" y="66" width="94" height="40" fill="none" stroke="currentColor" stroke-width="1.5" rx="3"></rect>
    <text x="303" y="90" font-size="10">模型请求</text>
    <rect x="418" y="66" width="112" height="40" fill="none" stroke="currentColor" stroke-width="1.5" rx="3"></rect>
    <text x="438" y="84" font-size="10">工具执行</text>
    <text x="438" y="98" font-size="9" opacity=".65">并发 / 独占</text>
    <rect x="570" y="66" width="94" height="40" fill="none" stroke="currentColor" stroke-width="1.5" rx="3"></rect>
    <text x="589" y="84" font-size="10">按序回填</text>
    <text x="589" y="98" font-size="9" opacity=".65">判决</text>
    <line x1="110" y1="86" x2="146" y2="86" stroke="currentColor" stroke-width="1.2" marker-end="url(#a1)"></line>
    <line x1="244" y1="86" x2="280" y2="86" stroke="currentColor" stroke-width="1.2" marker-end="url(#a1)"></line>
    <line x1="378" y1="86" x2="414" y2="86" stroke="currentColor" stroke-width="1.2" marker-end="url(#a1)"></line>
    <line x1="530" y1="86" x2="566" y2="86" stroke="currentColor" stroke-width="1.2" marker-end="url(#a1)"></line>
    <!-- 回环 -->
    <polyline points="664,106 700,106 700,140 63,140 63,110" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#a1)"></polyline>
    <text x="330" y="136" font-size="9.5" opacity=".7">还要继续：模型有活干，或队列里有话</text>
    <!-- 下方：中断 -->
    <line class="hl" x1="331" y1="176" x2="331" y2="112" stroke-width="1.3" marker-end="url(#a2)"></line>
    <line class="hl" x1="474" y1="176" x2="474" y2="112" stroke-width="1.3" marker-end="url(#a2)"></line>
    <line class="hl" x1="230" y1="176" x2="331" y2="176" stroke-width="1.3"></line>
    <line class="hl" x1="331" y1="176" x2="474" y2="176" stroke-width="1.3"></line>
    <text class="hl-fill" x="120" y="180" font-size="10.5">Esc / interrupt</text>
    <text class="hl-fill" x="284" y="200" font-size="9.5">断在流式输出里</text>
    <text class="hl-fill" x="436" y="200" font-size="9.5">断在工具执行里</text>
    <text x="284" y="214" font-size="9" opacity=".7">半句正文要留痕</text>
    <text x="436" y="214" font-size="9" opacity=".7">副作用可能已发生</text>
    <text x="16" y="240" font-size="9.5" opacity=".65">Claude Code 把这两格记成 aborted_streaming 与 aborted_tools；本仓的掐断只落在左边那一格</text>
  </g>
</svg>
