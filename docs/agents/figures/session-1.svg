<!-- 会话持久化与恢复三家对读 · 图 1。由 session.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 720 260" role="img" aria-label="三种会话日志结构对照：Claude Code 是一棵靠 parentUuid 向上走的树，codex 是若干不可变文件段加一个可变指针，deepseek-harness 是一条只追加的单调序列日志">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
    </marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="hl-fill" d="M 0 0 L 10 5 L 0 10 z"></path>
    </marker>
  </defs>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="currentColor">
    <!-- ============ 左：Claude Code 树 ============ -->
    <text x="0" y="14" font-size="11.5" font-weight="700">Claude Code</text>
    <text x="0" y="30" font-size="10" opacity=".62">走 parentUuid 找叶子</text>
    <circle cx="60" cy="58" r="7" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
    <circle cx="60" cy="100" r="7" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
    <circle cx="60" cy="142" r="7" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
    <circle cx="24" cy="184" r="7" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".45"></circle>
    <circle class="hl" cx="96" cy="184" r="7" fill="none" stroke-width="1.8"></circle>
    <line x1="60" y1="93" x2="60" y2="67" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"></line>
    <line x1="60" y1="135" x2="60" y2="109" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"></line>
    <line x1="30" y1="177" x2="54" y2="151" stroke="currentColor" stroke-width="1.2" opacity=".45" marker-end="url(#ar)"></line>
    <line class="hl" x1="90" y1="177" x2="66" y2="151" stroke-width="1.4" marker-end="url(#arf)"></line>
    <text class="hl-fill" x="112" y="188" font-size="9.5">选中的叶子</text>
    <text x="0" y="212" font-size="9.5" opacity=".6">支线：isSidechain</text>
    <text x="0" y="226" font-size="9.5" opacity=".6">同为主线取文件里最靠后的</text>
    <!-- ============ 中：codex 分段 ============ -->
    <text x="248" y="14" font-size="11.5" font-weight="700">codex</text>
    <text x="248" y="30" font-size="10" opacity=".62">不可变段 + 一个可变指针</text>
    <rect x="248" y="48" width="86" height="26" fill="none" stroke="currentColor" stroke-width="1.3" rx="2"></rect>
    <text x="256" y="65" font-size="9.5">0 – 40</text>
    <rect x="248" y="86" width="86" height="26" fill="none" stroke="currentColor" stroke-width="1.3" rx="2"></rect>
    <text x="256" y="103" font-size="9.5">40 – 92</text>
    <rect class="hl" x="248" y="124" width="86" height="26" fill="none" stroke-width="1.8" rx="2"></rect>
    <text class="hl-fill" x="256" y="141" font-size="9.5">92 – …</text>
    <line x1="291" y1="80" x2="291" y2="84" stroke="currentColor" stroke-width="1.2"></line>
    <line x1="291" y1="118" x2="291" y2="122" stroke="currentColor" stroke-width="1.2"></line>
    <text x="342" y="65" font-size="9.5" opacity=".62">history_base</text>
    <text x="342" y="103" font-size="9.5" opacity=".62">继承的排他前缀</text>
    <rect x="248" y="176" width="130" height="26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 3" rx="2"></rect>
    <text x="256" y="193" font-size="9.5">SQLite 路径指针</text>
    <line class="hl" x1="313" y1="174" x2="313" y2="154" stroke-width="1.4" marker-end="url(#arf)"></line>
    <text class="hl-fill" x="248" y="222" font-size="9.5">回退 = 新建一段 + CAS 换指针</text>
    <!-- ============ 右：dsh 单调日志 ============ -->
    <text x="520" y="14" font-size="11.5" font-weight="700">deepseek-harness</text>
    <text x="520" y="30" font-size="10" opacity=".62">只追加，一条不删</text>
    <rect x="520" y="46" width="150" height="20" fill="none" stroke="currentColor" stroke-width="1.4" rx="2"></rect>
    <text x="527" y="60" font-size="9.5">header · version 0</text>
    <rect x="520" y="70" width="165" height="18" fill="none" stroke="currentColor" stroke-width="1" opacity=".8" rx="1"></rect>
    <text x="527" y="83" font-size="9.5" opacity=".8">seq 1 · turn/start</text>
    <rect x="520" y="92" width="165" height="18" fill="none" stroke="currentColor" stroke-width="1" opacity=".8" rx="1"></rect>
    <text x="527" y="105" font-size="9.5" opacity=".8">seq 2 · assistant/message</text>
    <rect x="520" y="114" width="165" height="18" fill="none" stroke="currentColor" stroke-width="1" opacity=".8" rx="1"></rect>
    <text x="527" y="127" font-size="9.5" opacity=".8">seq 3 · tool/call</text>
    <rect class="hl" x="520" y="136" width="92" height="18" fill="none" stroke-width="1.4" stroke-dasharray="3 2" rx="1"></rect>
    <text class="hl-fill" x="527" y="149" font-size="9.5">seq 4 · 撕裂尾巴</text>
    <line class="hl" x1="616" y1="145" x2="656" y2="145" stroke-width="1.2" marker-end="url(#arf)"></line>
    <text class="hl-fill" x="520" y="176" font-size="9.5">读时按字节截断</text>
    <rect class="hl" x="520" y="184" width="165" height="18" fill="none" stroke-width="1.4" rx="1"></rect>
    <text class="hl-fill" x="527" y="197" font-size="9.5">seq 4′ · 合成的 tool/result</text>
    <text x="520" y="222" font-size="9.5" opacity=".6">再补 step/end 与 turn/end</text>
  </g>
</svg>
