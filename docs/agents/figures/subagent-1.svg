    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--vp-c-brand-1)"></path>
    </marker>
  </defs>
  <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--vp-c-text-3)">
    <text x="10" y="16" letter-spacing="0.08em">CLAUDE CODE · 调用树</text>
    <text x="265" y="16" letter-spacing="0.08em">CODEX · 路径树 + 信箱</text>
    <text x="545" y="16" letter-spacing="0.08em">DSH TEAMS · 名册 + 任务板</text>
  </g>
  <!-- Claude Code -->
  <g>
