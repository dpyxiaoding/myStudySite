<!-- 子代理的协作语义 · 图 1。由 subagent.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 760 300" role="img" aria-label="三种子代理拓扑的对照示意图">
