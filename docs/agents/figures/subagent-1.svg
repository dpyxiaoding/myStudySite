    <path d="M 45 70 L 45 108" stroke="var(--vp-c-border)" fill="none" marker-end="url(#ah)"></path>
    <path d="M 88 70 L 88 108" stroke="var(--vp-c-border)" fill="none" marker-end="url(#ah)"></path>
    <rect x="14" y="112" width="62" height="28" rx="3" fill="var(--vp-c-bg)" stroke="var(--vp-c-divider)"></rect>
    <text x="45" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--vp-c-text-2)">agent_id</text>
    <rect x="86" y="112" width="62" height="28" rx="3" fill="var(--vp-c-bg)" stroke="var(--vp-c-divider)"></rect>
