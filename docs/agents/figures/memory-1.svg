<!-- 谁替你记得 · 图 1。由 memory.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 880 300" role="img" aria-label="两条写记忆的路径对比：回合内直写只有一跳，文件直接落进记忆目录且没有回看的环节；codex 多两跳，先在会话结束后蒸馏成原始记忆，再由一个整合子智能体读取全部原始记忆与工作区差分，产出结构化的记忆目录">
  <defs>
    <marker id="me1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"></path>
    </marker>
  </defs>
  <!-- 上：回合内直写 -->
  <text x="14" y="22" font-family="Azeret Mono, monospace" font-size="11.5" class="f-a">回合内直写 —— Claude Code · 本仓</text>
  <rect x="14" y="36" width="150" height="40" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect>
  <text x="89" y="61" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11.5" fill="currentColor">模型判断值得记</text>
  <line x1="164" y1="56" x2="212" y2="56" stroke="currentColor" stroke-width="1.2" marker-end="url(#me1)"></line>
  <rect x="218" y="36" width="150" height="40" rx="3" class="k-a" fill="none" stroke-width="1.6"></rect>
  <text x="293" y="61" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11.5" class="f-a">写一个文件</text>
  <line x1="368" y1="56" x2="416" y2="56" stroke="currentColor" stroke-width="1.2" marker-end="url(#me1)"></line>
  <rect x="422" y="36" width="180" height="40" rx="3" fill="currentColor" opacity="0.07"></rect>
  <text x="512" y="61" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11.5" fill="currentColor">记忆目录 +1</text>
  <text x="622" y="52" font-family="Azeret Mono, monospace" font-size="11" fill="currentColor" opacity="0.7">没有回看的环节。</text>
  <text x="622" y="70" font-family="Azeret Mono, monospace" font-size="11" fill="currentColor" opacity="0.7">整理靠写之前自己找一遍。</text>
  <line x1="14" y1="102" x2="866" y2="102" stroke="currentColor" stroke-width="1" opacity="0.2"></line>
  <!-- 下：codex 两阶段 -->
  <text x="14" y="130" font-family="Azeret Mono, monospace" font-size="11.5" class="f-b">两阶段离线 —— codex</text>
  <rect x="14" y="144" width="132" height="40" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect>
  <text x="80" y="169" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11" fill="currentColor">一整条会话记录</text>
  <line x1="146" y1="164" x2="186" y2="164" stroke="currentColor" stroke-width="1.2" marker-end="url(#me1)"></line>
  <rect x="192" y="144" width="150" height="40" rx="3" class="k-b" fill="none" stroke-width="1.6"></rect>
  <text x="267" y="163" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11" class="f-b">Phase 1 蒸馏</text>
  <text x="267" y="177" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="9.5" fill="currentColor" opacity="0.7">每条会话一行入库</text>
  <line x1="342" y1="164" x2="382" y2="164" stroke="currentColor" stroke-width="1.2" marker-end="url(#me1)"></line>
  <rect x="388" y="144" width="132" height="40" rx="3" fill="currentColor" opacity="0.07"></rect>
  <text x="454" y="163" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11" fill="currentColor">jobs 表排队</text>
  <text x="454" y="177" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="9.5" fill="currentColor" opacity="0.7">租约 · 重试 · 水位线</text>
  <line x1="520" y1="164" x2="560" y2="164" stroke="currentColor" stroke-width="1.2" marker-end="url(#me1)"></line>
  <rect x="566" y="144" width="168" height="40" rx="3" class="k-b" fill="none" stroke-width="2"></rect>
  <text x="650" y="163" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11" class="f-b">Phase 2 整合子智能体</text>
  <text x="650" y="177" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="9.5" fill="currentColor" opacity="0.7">880 行提示词</text>
  <line x1="734" y1="164" x2="774" y2="164" stroke="currentColor" stroke-width="1.2" marker-end="url(#me1)"></line>
  <rect x="780" y="144" width="86" height="40" rx="3" fill="currentColor" opacity="0.07"></rect>
  <text x="823" y="169" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11" fill="currentColor">记忆目录</text>
  <!-- Phase 2 的两个额外输入 -->
  <path d="M 650 214 L 650 188" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#me1)"></path>
  <text x="650" y="232" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="currentColor" opacity="0.8">读全部已有记忆 ＋ 记忆目录自己的 git 差分</text>
  <text x="650" y="250" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="currentColor" opacity="0.8">——「哪些是新的」这个问题因此有确切答案</text>
  <!-- 额度守卫 -->
  <path d="M 454 214 L 454 188" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#me1)"></path>
  <text x="200" y="232" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" class="f-b">额度不够就整轮跳过</text>
  <text x="200" y="250" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="currentColor" opacity="0.8">记忆整理给用户的真实工作让路</text>
  <line x1="14" y1="270" x2="866" y2="270" stroke="currentColor" stroke-width="1" opacity="0.2"></line>
  <text x="14" y="290" font-family="Azeret Mono, monospace" font-size="11" fill="currentColor">多出来的那两跳买到的东西只有一样：<tspan class="f-b">有人回头看过全部旧记忆</tspan>。</text>
</svg>
