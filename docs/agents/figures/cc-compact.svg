<!-- Claude Code 的上下文管理 · 一次压缩的八步。由 claude-code/context.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 720 352" role="img" aria-label="Claude Code 一次压缩的八步：触发、PreCompact 钩子、清掉旧的工具输出、不够再发摘要请求；然后用摘要替换较早的对话、重新装回该留的内容、运行 SessionStart 钩子、运行 PostCompact 钩子">
  <defs>
    <marker id="cc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="currentColor"></polygon>
    </marker>
  </defs>
  <rect class="pane" x="10" y="20" width="160" height="104" rx="2"></rect>
  <text x="90" y="48" text-anchor="middle" font-size="13.5">① 触发</text>
  <text x="90" y="72" text-anchor="middle" font-size="10.5" opacity="0.72">自动：接近压缩窗口</text>
  <text x="90" y="88" text-anchor="middle" font-size="10.5" opacity="0.72">手动：/compact</text>
  <text x="90" y="104" text-anchor="middle" font-size="10.5" opacity="0.72">补救：请求因太长被拒</text>
  <rect class="pane" x="190" y="20" width="160" height="104" rx="2"></rect>
  <text x="270" y="48" text-anchor="middle" font-size="13.5">② PreCompact 钩子</text>
  <text x="270" y="72" text-anchor="middle" font-size="10.5" opacity="0.72">收到触发方式和压缩说明</text>
  <text x="270" y="88" text-anchor="middle" font-size="10.5" opacity="0.72">可以拦下这次压缩</text>
  <rect class="pane" x="370" y="20" width="160" height="104" rx="2"></rect>
  <text x="450" y="48" text-anchor="middle" font-size="13.5">③ 清掉旧的工具输出</text>
  <text x="450" y="72" text-anchor="middle" font-size="10.5" opacity="0.72">文档说先做这一步</text>
  <text x="450" y="88" text-anchor="middle" font-size="10.5" opacity="0.72">具体规则没有公开</text>
  <rect class="pane pane-us" x="550" y="20" width="160" height="104" rx="2"></rect>
  <text class="hl" x="630" y="48" text-anchor="middle" font-size="13.5">④ 发摘要请求</text>
  <text x="630" y="72" text-anchor="middle" font-size="10.5" opacity="0.72">系统提示词、工具、历史不变</text>
  <text x="630" y="88" text-anchor="middle" font-size="10.5" opacity="0.72">末尾追加一条压缩指令</text>
  <text class="hl" x="630" y="108" text-anchor="middle" font-size="10.5">前缀命中缓存</text>
  <rect class="pane" x="550" y="208" width="160" height="104" rx="2"></rect>
  <text x="630" y="236" text-anchor="middle" font-size="13.5">⑤ 替换历史</text>
  <text x="630" y="260" text-anchor="middle" font-size="10.5" opacity="0.72">较早的对话换成摘要</text>
  <text x="630" y="276" text-anchor="middle" font-size="10.5" opacity="0.72">原始消息仍在记录文件里</text>
  <rect class="pane" x="370" y="208" width="160" height="104" rx="2"></rect>
  <text x="450" y="236" text-anchor="middle" font-size="13.5">⑥ 重新装回</text>
  <text x="450" y="260" text-anchor="middle" font-size="10.5" opacity="0.72">CLAUDE.md、记忆、计划</text>
  <text x="450" y="276" text-anchor="middle" font-size="10.5" opacity="0.72">最近的文件、技能、git 状态</text>
  <rect class="pane" x="190" y="208" width="160" height="104" rx="2"></rect>
  <text x="270" y="236" text-anchor="middle" font-size="13.5">⑦ SessionStart 钩子</text>
  <text x="270" y="260" text-anchor="middle" font-size="10.5" opacity="0.72">匹配 compact 的钩子运行</text>
  <text x="270" y="276" text-anchor="middle" font-size="10.5" opacity="0.72">输出并入压缩后的上下文</text>
  <rect class="pane" x="10" y="208" width="160" height="104" rx="2"></rect>
  <text x="90" y="236" text-anchor="middle" font-size="13.5">⑧ PostCompact 钩子</text>
  <text x="90" y="260" text-anchor="middle" font-size="10.5" opacity="0.72">拿到摘要全文</text>
  <text x="90" y="276" text-anchor="middle" font-size="10.5" opacity="0.72">只能做后续处理</text>
  <line x1="172" y1="72" x2="186" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <line x1="352" y1="72" x2="366" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <line x1="532" y1="72" x2="546" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <text class="hl" x="540" y="13" text-anchor="middle" font-size="10.5">不够才摘要</text>
  <line x1="630" y1="126" x2="630" y2="204" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <line x1="548" y1="260" x2="534" y2="260" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <line x1="368" y1="260" x2="354" y2="260" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <line x1="188" y1="260" x2="174" y2="260" stroke="currentColor" stroke-width="1.3" marker-end="url(#cc-ar)"></line>
  <text x="360" y="340" text-anchor="middle" font-size="10.5" opacity="0.72">②⑦⑧ 是给开发者的钩子；没配置钩子时直接跳过</text>
</svg>
