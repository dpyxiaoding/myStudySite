<!-- 凭证与身份三家对读 · 图 2。由 credentials.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 900 330" role="img" aria-label="对比两条路径：codex 与 deepseek-harness 让工具子进程读到真凭证并原样带进出站请求；Claude Code 让子进程只读到哨兵值，由出站代理在命中 injectHosts 时换回真凭证">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"></polygon>
    </marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="hl-fill" points="0,0 10,5 0,10"></polygon>
    </marker>
  </defs>
  <text x="0" y="16" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.6">codex · deepseek-harness</text>
  <rect x="0" y="30" width="160" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="80" y="59" text-anchor="middle" font-size="13" fill="currentColor">工具子进程</text>
  <rect x="230" y="30" width="220" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="340" y="52" text-anchor="middle" font-size="13" fill="currentColor">~/.aws/credentials</text>
  <text x="340" y="69" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">真凭证</text>
  <rect x="700" y="30" width="200" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="800" y="52" text-anchor="middle" font-size="13" fill="currentColor">出站请求</text>
  <text x="800" y="69" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">带真凭证</text>
  <line x1="160" y1="54" x2="224" y2="54" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah2)"></line>
  <text x="192" y="44" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">读</text>
  <line x1="450" y1="54" x2="694" y2="54" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah2)"></line>
  <text x="572" y="44" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">原样带上</text>
  <line x1="0" y1="112" x2="900" y2="112" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"></line>
  <text x="0" y="140" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.6">Claude Code</text>
  <rect x="0" y="154" width="160" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="80" y="183" text-anchor="middle" font-size="13" fill="currentColor">工具子进程</text>
  <rect x="230" y="154" width="220" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="340" y="176" text-anchor="middle" font-size="13" fill="currentColor">绑定上去的哨兵文件</text>
  <text x="340" y="193" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor" opacity="0.65">████████</text>
  <rect class="hl" x="500" y="154" width="150" height="48" rx="4" fill="none" stroke-width="2"></rect>
  <text x="575" y="176" text-anchor="middle" font-size="13" fill="currentColor">出站代理</text>
  <text x="575" y="193" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">终止 TLS</text>
  <rect x="700" y="154" width="200" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
  <text x="800" y="176" text-anchor="middle" font-size="13" fill="currentColor">出站请求</text>
  <text x="800" y="193" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">带真凭证</text>
  <line x1="160" y1="178" x2="224" y2="178" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah2)"></line>
  <text x="192" y="168" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">读</text>
  <line x1="450" y1="178" x2="494" y2="178" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah2)"></line>
  <text x="472" y="168" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">发出</text>
  <line class="hl" x1="650" y1="178" x2="694" y2="178" stroke-width="2" marker-end="url(#ah3)"></line>
  <rect class="hl" x="470" y="264" width="210" height="46" rx="4" fill="none" stroke-width="1.4" stroke-dasharray="4 3"></rect>
  <text x="575" y="292" text-anchor="middle" font-size="12" fill="currentColor">真凭证只在宿主进程里</text>
  <line class="hl" x1="575" y1="264" x2="575" y2="208" stroke-width="1.6" marker-end="url(#ah3)"></line>
  <text x="590" y="240" font-size="10.5" fill="currentColor" opacity="0.85">injectHosts 命中才替换</text>
</svg>
