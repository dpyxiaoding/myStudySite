<!-- 企业部署面三家对读 · 图 1。由 enterprise.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏 -->
<svg viewBox="0 0 1000 340" role="img" aria-label="三家的管理员权威进入配置解析的位置不同：Claude Code 的托管档压在用户与项目之上；codex 的企业层在层栈里反而低于用户与项目，强制力来自一道与层栈平行的 requirements 闸门；deepseek-harness 没有管理员档，只有压在用户档之下的部署方组合层">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
