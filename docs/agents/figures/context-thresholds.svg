  <text x="160" y="226" font-size="10.5" opacity="0.8">窗口 100 万（内置的 DeepSeek 模型）</text>
  <text class="warn" x="620" y="226" text-anchor="middle" font-size="10">输出预留 25.6 万</text>
  <text class="warn" x="519.8" y="250" text-anchor="middle" font-size="10">余量 65,536</text>
  <line x1="566" y1="202" x2="566" y2="242" stroke="currentColor" stroke-dasharray="3 3" opacity="0.6"></line>
  <text x="570" y="198" font-size="10" opacity="0.65">名义上的 80%</text>
