<!-- 上下文管理：三家差异 · 默认配置下在哪压缩。由 context.md 引用；文件里不要留空行，否则 Markdown 会把图拆坏。比例：1 万 token = 5.2 px，起点 x=150 -->
<svg viewBox="0 0 720 292" role="img" aria-label="三家默认配置下的压缩点，按同一比例画。Claude Code 的窗口 100 万，约 96.7 万时压缩。codex 内置模型的窗口 27.2 万，24.48 万也就是 90% 时压缩，最后 5% 预留，窗口最多可设到 87.2 万。dsh 用默认的 DeepSeek 接口，窗口 100 万，最后 25.6 万预留给输出，再留 65,536 的余量，约 67.8 万时压缩，名义上的 80% 用不上">
  <text x="150" y="16" font-size="11" opacity="0.7">三条按同一比例画，满宽是 100 万 token</text>
