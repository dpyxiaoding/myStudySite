  <rect class="ghost" x="151" y="49" width="501.8" height="26"></rect>
  <text x="160" y="66" font-size="10.5" opacity="0.8">窗口 100 万（原生 100 万窗口的模型）</text>
  <line class="hl" x1="652.8" y1="42" x2="652.8" y2="82" stroke-width="1.6"></line>
  <text class="hl" x="647" y="38" text-anchor="end" font-size="10.5">约 96.7 万时压缩</text>
  <text class="f-b" x="138" y="147" text-anchor="end" font-size="12">codex</text>
  <rect class="pane" x="150" y="128" width="453.4" height="28" rx="2" stroke-dasharray="4 3"></rect>
  <text x="595" y="146" text-anchor="end" font-size="10" opacity="0.6">窗口最多可设到 87.2 万</text>
  <rect class="pane" x="150" y="128" width="141.4" height="28" rx="2"></rect>
  <rect class="ghost" x="151" y="129" width="126.3" height="26"></rect>
