  <line class="hl" x1="608" y1="32" x2="608" y2="74" stroke-width="1.6"></line>
  <text class="hl" x="614" y="30" font-size="10.5">90%</text>
  <text x="150" y="57" font-size="10.5" opacity="0.8">窗口 × 9/10，可用配置值压低</text>
